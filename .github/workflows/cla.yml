# Asks first-time contributors to sign the CLA once, by commenting on their pull request.
# Signatures are recorded in signatures/cla.json on the cla-signatures branch.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    # Bots such as Dependabot don't sign.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v2.6.1 commit; it never checks out the pull request's code.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/aidevs-pt/ffmpeg-builds/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: IAntonioDev,dependabot,github-actions,*[bot]
          lock-pullrequest-aftermerge: false
